name: Build APK

on:
  workflow_dispatch:

# A2: workflow ini hanya membaca repo (checkout + build); tidak butuh tulis.
permissions:
  contents: read

# A3: satu run per branch; run baru membatalkan run lama yang masih jalan.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: "./gradlew :app:testDebugUnitTest --stacktrace"
      - name: Lint
        # A3: lint dilaporkan tapi tidak menggagalkan build (masih ada temuan
        # lama yang belum dibersihkan); laporannya diunggah sebagai artefak.
        continue-on-error: true
        run: "./gradlew :app:lintDebug --stacktrace"
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename release APK
        # A1: nama APK diambil dari versionName (bukan hardcode).
        run: |
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/SysFileManager-$VERSION-Release.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysFile Manager
          path: app/build/outputs/apk/release/SysFileManager-${{ env.VERSION }}-Release.apk
