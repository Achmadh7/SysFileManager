name: Build APK

on:
  workflow_dispatch:

# A2: workflow ini hanya membaca repo (checkout + build); tidak butuh tulis.
permissions:
  contents: read

# A3: satu run per branch; run baru membatalkan run lama yang masih jalan.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: "./gradlew :app:testDebugUnitTest --stacktrace"
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.SYSFILE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SYSFILE_STORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          SYSFILE_STORE_FILE: ${{ env.SYSFILE_STORE_FILE || secrets.SYSFILE_STORE_FILE }}
          SYSFILE_STORE_PASSWORD: ${{ secrets.SYSFILE_STORE_PASSWORD }}
          SYSFILE_KEY_ALIAS: ${{ secrets.SYSFILE_KEY_ALIAS }}
          SYSFILE_KEY_PASSWORD: ${{ secrets.SYSFILE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Rename release APK
        # A1: nama APK diambil dari versionName (bukan hardcode).
        run: |
          VERSION=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Sysfile Manager $VERSION-Release.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sysfile Manager
          path: app/build/outputs/apk/release/Sysfile Manager ${{ env.VERSION }}-Release.apk
